spring.datasource.url=jdbc:h2:file:./leavedb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.open-in-view=false

# Escalation: a request sitting at PENDING_MANAGER longer than this is escalated to HR.
# 60 s for the hackathon demo; production would use days (e.g. 259200).
app.escalation.timeout-seconds=60

# Conflict detection: flag a request when this many teammates are already off on any day of its range.
app.conflict.max-simultaneous=2
